<head>

    <meta name="description" content="Login to PropertyCost to access your saved calculations, personalized real estate tools, and investment analysis dashboards.">

    <link rel="preload" href="/fonts/Inter-Italic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48x48.png">
    <meta name="robots" content="noindex, nofollow">
    <link rel="mask-icon" href="/images/favicon-mask.svg" color="#000000">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/main.css">
    <title>Login</title>
</head>
<body>
    <!--<form id="loginForm">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Пароль" required />

        <label>
            <input type="checkbox" name="rememberMe" />
            Запомнить меня

        <button type="submit">Войти</button>

    <button id="facebookLogin">Войти через Facebook</button>
    <button id="appleLogin">Войти через Apple</button>-->
    
    <div class="login-page">
    
        <div class="login-card">
    
            <div class="login-header">
                <h1 class="text-center">PropertyCost</h1>
                <p class="text-center">Secure access to financial transactions</p>
            </div>

            <div id="error" class="login-error hidden"></div>
    
            <form id="loginForm" class="login-form">
    
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@company.com" required />
                </div>
    
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required />
                </div>

                
    
                <div class="form-options">
                    <!-- <label class="remember">
                        <input type="checkbox" name="rememberMe" />
                        remember me
                    </label> -->
    
                    <!--<a href="#" class="forgot">Забыли пароль?</a>-->
                </div>
    
                <button type="submit" class="btn-primary">
                    Login
                </button>
    
            </form>
    
            <div class="divider">
                <span>or</span>
            </div>
    
            <div class="social-login">
                <button id="googleLogin" class="btn-social google">
                    Login with Google
                </button>
    
                <!-- <button id="facebookLogin" class="btn-social facebook">
                    Login with Facebook
                </button>  -->
                
            </div>
    
        </div>
    
    </div>



    <script src="/js/login.js"></script>
</body>
