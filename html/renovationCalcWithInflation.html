<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/mainForRenovationCalc.css">
    <title>Document</title>
</head>
<body>
    <a href="./mainPage.html" class="back-btn">← Назад</a>

    <section class="calculator">
        <h1>Калькулятор реновации</h1>
        <p class="subtitle">
            Оценка окупаемости ремонта и влияния на инвестицию
        </p>

        <div class="grid">

            <!-- ПАРАМЕТРЫ -->
            <div class="card">
                <h3>Объект</h3>

                <label>
                    Цена до ремонта
                    <input type="number" id="priceBefore" value="100000">
                </label>

                <label>
                    Аренда до ремонта (в год)
                    <input type="number" id="rentBefore" value="9000">
                </label>

                <label>
                    Стоимость ремонта
                    <input type="number" id="renovationCost" value="15000">
                </label>

                <label>
                    Рост цены после ремонта (%)
                    <input type="number" id="priceIncrease" value="12">
                </label>

                <label>
                    Рост аренды после ремонта (%)
                    <input type="number" id="rentIncrease" value="20">
                </label>
            </div>

            <!-- ПРОДАЖА -->
            <div class="card">
                <h3>Продажа</h3>

                <label>
                    Комиссия агента (%)
                    <input type="number" id="agentFee" value="3">
                </label>

                <label>
                    Налог при продаже (%)
                    <input type="number" id="saleTax" value="5">
                </label>

                <label>
                    Срок владения (лет)
                    <input type="number" id="years" value="5">
                </label>

                <button id="calcBtn">Рассчитать</button>
            </div>

            <!-- РЕЗУЛЬТАТ -->
            <div class="card result">
                <h3>Результаты</h3>

                <div class="row">
                    <span>Цена после ремонта</span>
                    <strong id="priceAfter">—</strong>
                </div>

                <div class="row">
                    <span>Аренда после ремонта</span>
                    <strong id="rentAfter">—</strong>
                </div>

                <div class="row">
                    <span>Доп. доход от аренды</span>
                    <strong id="extraRent">—</strong>
                </div>

                <div class="row">
                    <span>Чистая прибыль ремонта</span>
                    <strong id="netProfit">—</strong>
                </div>

                <div class="row">
                    <span>ROI ремонта</span>
                    <strong id="roi">—</strong>
                </div>

                <div class="row">
                    <span>Окупаемость</span>
                    <strong id="payback">—</strong>
                </div>
            </div>

        </div>
    </section>

    <script src="/js/renovationCalc.js"></script>
</body>
</html>
