<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/mainForBreakEven.css">
    <title>Document</title>
</head>
<body>

    <section class="calculator">
        <h1>Точка безубыточности недвижимости</h1>
        <p class="subtitle">
            Узнайте минимальную аренду и максимальную цену покупки
        </p>

        <div class="grid">
            <!-- Входные данные -->
            <div class="card">
                <h3>Исходные данные</h3>

                <label>
                    Цена покупки
                    <input type="number" id="price" value="100000">
                </label>

                <label>
                    Первоначальный взнос
                    <input type="number" id="downPayment" value="20000">
                </label>

                <label>
                    Ипотека в месяц
                    <input type="number" id="mortgage" value="600">
                </label>

                <label>
                    Расходы в месяц
                    <input type="number" id="expenses" value="200">
                </label>

                <label>
                    Налоги и страхование (в месяц)
                    <input type="number" id="taxes" value="100">
                </label>

                <label>
                    Простой (%)
                    <input type="number" id="vacancy" value="5">
                </label>

                <button id="calcBtn">Рассчитать</button>
            </div>

            <!-- Результаты -->
            <div class="card result">
                <h3>Результаты</h3>

                <div class="row">
                    <span>Минимальная аренда</span>
                    <strong id="breakEvenRent">—</strong>
                </div>

                <div class="row">
                    <span>Макс. цена покупки</span>
                    <strong id="breakEvenPrice">—</strong>
                </div>

                <div class="hint">
                    Значения показывают точку, при которой объект не приносит ни прибыли, ни убытков
                </div>
            </div>
        </div>
    </section>

    <script src="/js/BreakEven.js"></script>
</body>
</html>
