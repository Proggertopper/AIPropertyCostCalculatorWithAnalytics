<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/mainForRealOverpayment.css">
    <title>Document</title>
</head>
<body>
    <a href="./mainPage.html" class="back-btn">← Назад</a>

    <section class="calculator">
        <h1>Реальная переплата по ипотеке</h1>
        <p class="subtitle">
            Узнайте, сколько вы реально переплачиваете с учётом инфляции
        </p>

        <div class="grid">
            <!-- INPUT -->
            <div class="card">
                <h3>Параметры ипотеки</h3>

                <label>
                    Сумма кредита
                    <input type="number" id="loan" value="80000">
                </label>

                <label>
                    Процентная ставка (% годовых)
                    <input type="number" id="rate" value="8">
                </label>

                <label>
                    Срок кредита (лет)
                    <input type="number" id="years" value="20">
                </label>

                <label>
                    Инфляция (% в год)
                    <input type="number" id="inflation" value="5">
                </label>

                <button onclick="calculateOverpayment()">Рассчитать</button>
            </div>

            <!-- RESULT -->
            <div class="card result">
                <h3>Результаты</h3>

                <div class="row">
                    <span>Ежемесячный платёж</span>
                    <strong id="payment">—</strong>
                </div>

                <div class="row">
                    <span>Номинальная переплата</span>
                    <strong id="nominalOverpayment">—</strong>
                </div>

                <div class="row">
                    <span>Реальная переплата</span>
                    <strong id="realOverpayment">—</strong>
                </div>

                <div class="explain">
                    Реальная переплата учитывает снижение покупательной способности денег
                </div>
            </div>
        </div>
    </section>

    <script src="../js/realOverpayment.js"></script>
</body>
</html>
