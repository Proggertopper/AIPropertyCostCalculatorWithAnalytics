<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/mainForIRR.css">
    <title>IRR</title>
</head>
<body>
    <a href="./mainPage.html" class="back-btn">← Назад</a>
    <section class="calculator">
        <h2>Инвестиционная эффективность недвижимости</h2>
        <p class="subtitle">
            Рассчитайте доходность объекта с учётом аренды, расходов и продажи
        </p>
    
        <div class="calc-grid">
            <!-- Ввод -->
            <div class="calc-card">
                <h3>Параметры объекта</h3>
    
                <label>
                    Цена объекта
                    <input type="number" id="price" value="100000">
                </label>
    
                <label>
                    Первоначальный взнос
                    <input type="number" id="downPayment" value="20000">
                </label>
    
                <label>
                    Расходы на сделку
                    <input type="number" id="purchaseCosts" value="5000">
                </label>
    
                <label>
                    Ремонт
                    <input type="number" id="renovation" value="10000">
                </label>
            </div>
    
            <div class="calc-card">
                <h3>Доход и расходы</h3>
    
                <label>
                    Аренда в месяц
                    <input type="number" id="rent" value="900">
                </label>
    
                <label>
                    Простой (%)
                    <input type="number" id="vacancy" value="5">
                </label>
    
                <label>
                    Расходы в год
                    <input type="number" id="expenses" value="3000">
                </label>
    
                <label>
                    Ипотека в год
                    <input type="number" id="mortgage" value="6000">
                </label>
            </div>
    
            <div class="calc-card">
                <h3>Инвестиционные параметры</h3>
    
                <label>
                    Срок владения (лет)
                    <input type="number" id="years" value="10">
                </label>
    
                <label>
                    Рост стоимости (% в год)
                    <input type="number" id="growth" value="3">
                </label>
    
                <label>
                    Налог при продаже (%)
                    <input type="number" id="saleTax" value="5">
                </label>
    
                <button id="calcBtn">Рассчитать</button>
            </div>
    
            <!-- Результат -->
            <div class="calc-card result">
                <h3>Результаты</h3>
    
                <div class="result-item">
                    <span>Cash Flow / год</span>
                    <strong id="cashFlow">—</strong>
                </div>
    
                <div class="result-item">
                    <span>ROI</span>
                    <strong id="roi">—</strong>
                </div>
    
                <div class="result-item">
                    <span>IRR</span>
                    <strong id="irr">—</strong>
                </div>
    
                <div class="result-item">
                    <span>Окупаемость</span>
                    <strong id="payback">—</strong>
                </div>
            </div>
        </div>
    </section>


    <script src="/js/IRR.js"></script>
</body>
</html>
