<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-4041439086297277">
    <meta name="description" content="Mortgage calculator for US homes: calculate monthly payments, interest, and loan terms quickly with PropertyCost.">

    <link rel="preload" href="/fonts/Inter-Italic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48x48.png">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://mypropertycost.com/mortgage.html">
    <link rel="mask-icon" href="/images/favicon-mask.svg" color="#000000">
    <link rel="stylesheet" href="/css/mainMortgage.css">
    <link rel="stylesheet" href="/css/main.css">
    <title>MortgageOfProperty — PropertyCost</title>
</head>
<body>

    <a href="./allCalculators.html" class="back-btn">← Back</a>

    <main id="main-content">
    <section class="calculator">
        <h1>Mortgage Calculator</h1>
        <p class="subtitle">
            Calculate your monthly payment and total loan cost
        </p>
    
        <div class="grid">
    
            <!-- INPUT -->
            <div class="card">
                <h3>Parameters</h3>
    <!-- placeholder="75000" хз ставить или нет -->
                <form id="propertyCalculator">
                    <label>
                        Property Price ($)
                        <input type="number" id="propertyPrice">
                        <div class="error" id="priceError"></div>
                    </label>
    
                    <label>
                        Down Payment ($)
                        <input type="number" id="downPayment">
                        <div class="error" id="downError"></div>
                    </label>
    
                    <label>
                        Interest Rate (%)
                        <input type="number" id="interestRate">
                        <div class="error" id="rateError"></div>
                    </label>
    
                    <label>
                        Loan Term (years)
                        <input type="number" id="loanTerm">
                        <div class="error" id="termError"></div>
                    </label>
    
                    <button type="submit">Calculate</button>
                </form>
            </div>
    
            <!-- RESULT -->
            <div id="results" class="card result">
                <h3>Results</h3>
    
                <div class="row">
                    <span>Monthly Payment</span>
                    <strong id="monthlyPayment">—</strong>
                </div>
    
                <div class="row">
                    <span>Total Payment</span>
                    <strong id="totalPayment">—</strong>
                </div>
    
                <div class="row">
                    <span>Total Interest</span>
                    <strong id="totalInterest">—</strong>
                </div>
            </div>
        </div>
    
        <p class="disclaimer">
            Results are for informational purposes only and do not constitute financial advice.
            <a href="/disclaimer.html">Read full disclaimer</a>
        </p>
    </section>
    </main>

    <script src="/js/mortgage.js"></script>
</body>
</html>
