<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/mainForAlternativeInvest.css">
    <title>Document</title>
</head>
<body>

    <section class="calculator">
        <h1>Недвижимость vs Альтернативные инвестиции</h1>
        <p class="subtitle">
            Сравните, что принесёт больше денег за одинаковый срок
        </p>

        <div class="grid">
            <!-- Недвижимость -->
            <div class="card">
                <h3>Недвижимость</h3>

                <label>
                    Первоначальные вложения
                    <input type="number" id="propertyInitial" value="30000">
                </label>

                <label>
                    Cash Flow в год
                    <input type="number" id="propertyCashflow" value="3000">
                </label>

                <label>
                    Рост стоимости (% в год)
                    <input type="number" id="propertyGrowth" value="3">
                </label>
            </div>

            <!-- Альтернативные инвестиции -->
            <div class="card">
                <h3>Альтернативные инвестиции</h3>

                <label>
                    Ожидаемая доходность (% в год)
                    <input type="number" id="altReturn" value="8">
                </label>

                <label>
                    Дополнительные взносы в год
                    <input type="number" id="altContribution" value="0">
                </label>
            </div>

            <!-- Общие параметры -->
            <div class="card">
                <h3>Параметры</h3>

                <label>
                    Срок инвестирования (лет)
                    <input type="number" id="years" value="10">
                </label>

                <button id="calcBtn">Сравнить</button>
            </div>

            <!-- Результаты -->
            <div class="card result">
                <h3>Результат</h3>

                <div class="row">
                    <span>Итог (недвижимость)</span>
                    <strong id="propertyResult">—</strong>
                </div>

                <div class="row">
                    <span>Итог (альтернатива)</span>
                    <strong id="alternativeResult">—</strong>
                </div>

                <div id="winner" class="winner">—</div>
            </div>
        </div>
    </section>

    <script src="/js/alternativeInvest.js"></script>
</body>
</html>
