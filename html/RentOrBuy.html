<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <title>Rent Or Buy Calculator</title>
</head>
<body class="d-flex h-screen flex-d-col align-items-center justify-content-center">

    <header class="text-align-center mb-4">
        <h1 class="mb-2">Rent or Buy Calculator</h1>
        <p>Сравните, что выгоднее: аренда или покупка недвижимости</p>
    </header>

    <main class="card">
    <form id="rentVsBuy">

        <div class="mb-3">
            <label for="rent">Аренда в месяц ($)</label>
            <input type="number" id="rent">
            <div class="error" id="rentError"></div>
        </div>

        <div class="mb-3">
            <label for="mortgage">Ипотека в месяц ($)</label>
            <input type="number" id="mortgage">
            <div class="error" id="mortgageError"></div>
        </div>

        <div class="mb-3">
            <label for="years">Срок (лет)</label>
            <input type="number" id="years">
            <div class="error" id="yearsError"></div>
        </div>

        <button type="submit" class="btn-primary">Сравнить</button>
    </form>
    
    <div class="mt-4">
        <p id="rentResult"></p>
        <p id="buyResult"></p>
        <p id="winner"></p>
    </div>
</main>

<footer class="footer">
    <div class="footer-content">
        <p>© 2025 PropertyCost</p>
        <ul class="footer-links mb-2">
            <li><a href="#">Privacy Policy</a></li>
            <li><a href="#">Terms of Service</a></li>
            <li><a href="./disclaimer.html">Disclaimer</a></li>
            <li><a href="#">Contact us</a></li>
            <li><a href="#">About</a></li>
        </ul>
    </div>
</footer>


    <script src="../js/rentVsBuy.js"></script>
</body>
</html>
