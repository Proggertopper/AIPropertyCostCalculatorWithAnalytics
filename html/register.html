<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-4041439086297277">
    <meta name="description" content="Register at PropertyCost to save calculations, access personalized real estate tools, and get accurate property analysis online.">

    <link rel="preload" href="/fonts/Inter-Italic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48x48.png">
    <meta name="robots" content="noindex, nofollow">
    <link rel="mask-icon" href="/images/favicon-mask.svg" color="#000000">
    <link rel="stylesheet" href="/css/register.css">
    <link rel="stylesheet" href="/css/main.css">
    <title>Sign up</title>
</head>
<body> 
    <!--<form id="registerForm">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Пароль" required />
        <button type="submit">Зарегистрироваться</button>
        <button id="googleLogin">Продолжить через Google</button>
        <button id="facebookLogin">Продолжить через Facebook</button>
        <button id="appleLogin">Продолжить через Apple</button>
    </form>-->

    <div class="auth-page">
    
        <div class="auth-card">
    
            <div class="auth-header">
                <h1 class="text-center">PropertyCost</h1>
                <p class="text-center">Create a secure business account</p>
            </div>

            <div id="error" class="auth-error hidden"></div>
    
            <form id="registerForm" class="auth-form">
    
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@company.com" required />
                </div>
    
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Minimum 8 characters" required />
                </div>
    
                <button type="submit" class="btn-primary">
                    Sign up
                </button>
    
            </form>
    
            <div class="divider">
                <span>or</span>
            </div>
    
            <div class="social-auth">
                <button id="googleLogin" class="btn-social google">
                    Continue via Google
                </button>
    
                <!-- <button id="facebookLogin" class="btn-social facebook">
                    Continue via Facebook
                </button> -->
            </div>
    
            <div class="auth-footer">
                Already have an account?
                <a href="./login.html">Login</a>
            </div>
    
        </div>
    
    </div>
    
    <script src="/js/register.js"></script>

</body>
</html>
