<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/images/discount_5094378.png">
    <title>Registration</title>
</head>
<body>

        <input type="email" id="email" placeholder="Email" required />

    <div class="auth-page">
    
        <div class="auth-card">
    
            <div class="auth-header">
                <h1>PropertyCost</h1>
                <p>Create a secure business account</p>
            </div>

            <div id="error" class="auth-error"></div>
    
            <form id="registerForm" class="auth-form">
    
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@company.com" required />
                </div>
    
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Minimum 8 characters" required />
                </div>
    
                <button type="submit" class="btn-primary">
                    Register
                </button>
    
            </form>
    
            <div class="divider">
                <span>or</span>
            </div>
    
            <div class="social-auth">
                <button id="googleLogin" class="btn-social google">
                    Continue via Google
                </button>
    
                <button id="facebookLogin" class="btn-social facebook">
                    Continue via Facebook
                </button>
            </div>
    
            <div class="auth-footer">
                Already have an account?
                <a href="./login.html">Login</a>
            </div>
    
        </div>
    
    </div>
    
    <script src="/js/register.js"></script>

</body>
</html>
